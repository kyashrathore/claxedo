name: Feature request
description: Suggest something Claxedo should do
labels: ["enhancement"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Not already requested
      options:
        - label: I searched existing issues and discussions and did not find this request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or problem behind the request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like Claxedo to do
    validations:
      required: false
